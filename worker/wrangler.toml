name = "grow-up-everyday-explain"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
ALLOWED_ORIGINS = "https://subeen2.github.io,http://localhost:5173"

# `npx wrangler kv namespace create RATE_LIMIT` 출력의 id로 교체
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# `npx wrangler vectorize create en-words --dimensions=1536 --metric=cosine`로 먼저 생성
[[vectorize]]
binding = "EN_WORDS"
index_name = "en-words"
