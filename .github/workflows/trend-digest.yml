name: Weekly Claude Trend Digest

on:
  schedule:
    - cron: '0 23 * * 0' # 매주 일 23:00 UTC = 월 08:00 KST
  workflow_dispatch: {}

permissions:
  contents: write

# 수동 실행과 예약 실행이 겹쳐 같은 다이제스트를 두 번 보내지 않도록 한다.
concurrency:
  group: trend-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: node scripts/trend-digest.mjs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO_EMAIL: ${{ secrets.DIGEST_TO_EMAIL }}
          TZ: Asia/Seoul
      - name: Commit digest state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/trend-state.json
          git diff --cached --quiet || git commit -m "chore: update trend digest state"
          # 메일은 이미 보냈으므로 push가 실패하면 다음 주에 같은 메일이 다시 간다. 실행 중 main에 다른 커밋이 생겨도 push되게 rebase한다.
          git pull --rebase
          git push
